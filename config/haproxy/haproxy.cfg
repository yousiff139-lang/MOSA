global
    log stdout format raw daemon info
    maxconn 256

defaults
    log     global
    mode    http
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend docker_in
    bind :2375
    mode http

    # HTTP Methods
    acl is_get  method GET
    acl is_post method POST
    acl is_delete method DELETE

    # 🛑 1. Explicitly Deny Destructive & Privilege Escalation Paths
    acl is_create_container path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/create
    acl is_exec path,url_dec -m reg -i ^(/v[\d\.]+)?/(containers/[a-zA-Z0-9_.-]+/exec|exec/)
    acl is_volumes path,url_dec -m reg -i ^(/v[\d\.]+)?/volumes
    acl is_build path,url_dec -m reg -i ^(/v[\d\.]+)?/build
    acl is_swarm path,url_dec -m reg -i ^(/v[\d\.]+)?/swarm
    acl is_plugins path,url_dec -m reg -i ^(/v[\d\.]+)?/plugins
    acl is_secrets path,url_dec -m reg -i ^(/v[\d\.]+)?/secrets
    acl is_networks_write path,url_dec -m reg -i ^(/v[\d\.]+)?/networks/create

    # 🟢 2. Whitelisted Safe Read-Only Endpoints
    acl is_ping path,url_dec -m reg -i ^(/v[\d\.]+)?/_ping
    acl is_info path,url_dec -m reg -i ^(/v[\d\.]+)?/info
    acl is_version path,url_dec -m reg -i ^(/v[\d\.]+)?/version
    acl is_list_containers path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/json
    acl is_inspect_container path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/json
    
    # 🟢 3. Whitelisted Safe Supervisor Operation (Restart/Stop/Start ONLY)
    acl is_restart_container path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/restart
    acl is_stop_container path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/stop
    acl is_start_container path,url_dec -m reg -i ^(/v[\d\.]+)?/containers/[a-zA-Z0-9_.-]+/start

    # Enforce Explicit Rejections (403 Forbidden)
    http-request deny if is_delete
    http-request deny if is_create_container
    http-request deny if is_exec
    http-request deny if is_volumes
    http-request deny if is_build
    http-request deny if is_swarm
    http-request deny if is_plugins
    http-request deny if is_secrets
    http-request deny if is_networks_write

    # Allow Approved Safe Endpoints
    http-request allow if is_ping
    http-request allow if is_info is_get
    http-request allow if is_version is_get
    http-request allow if is_list_containers is_get
    http-request allow if is_inspect_container is_get
    http-request allow if is_restart_container is_post
    http-request allow if is_stop_container is_post
    http-request allow if is_start_container is_post

    # 🛑 4. Default Deny (Block everything else)
    http-request deny

    default_backend docker_out

backend docker_out
    mode http
    server docker_sock /var/run/docker.sock
