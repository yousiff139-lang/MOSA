# MOSA Smart Home - Mosquitto MQTT Broker Configuration
# Environment: Production Strict mTLS Enforcement (Port 1883 DISABLED)

per_listener_settings true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all


# 🟢 mTLS Secured Listener Port for ESP32 & Backend (Port 8883 ONLY)
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
crlfile /mosquitto/config/certs/crl.pem
acl_file /mosquitto/config/acl.conf
require_certificate true
use_identity_as_username true
# Minimum TLS version: TLSv1.2 enforced (TLSv1.3 automatically negotiated when supported)
tls_version tlsv1.2
allow_anonymous false

# 🟢 WebSocket over TLS (WSS) for Web & Mobile PWAs (Port 9001 ONLY)
listener 9001 0.0.0.0
protocol websockets
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
crlfile /mosquitto/config/certs/crl.pem
require_certificate true
tls_version tlsv1.2
allow_anonymous false
