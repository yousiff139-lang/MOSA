# MOSA Smart Platform - Mosquitto Access Control List (ACL)
# Enterprise Zero-Trust Identity-Bound Architecture (v3.2.3)

# =========================================================================
# 🟢 GLOBAL PATTERNS (Applies to ALL connecting users & devices)
# Dynamic Identity Binding: %u = Authenticated Certificate Common Name (CN)
# =========================================================================
pattern readwrite mosa/+/device/%u/#
pattern readwrite mosa/+/controller/%u/#
pattern readwrite mosa/+/sensor/%u/#
pattern readwrite mosa/+/ota/%u/#
pattern readwrite mosa/%u/device/#
pattern readwrite mosa/%u/controller/#
pattern readwrite mosa/%u/sensor/#
pattern readwrite mosa/%u/ota/#
pattern readwrite homeassistant/%u/#

# Shared Discovery & Broadcast Topics
pattern readwrite mosa/scan
pattern readwrite mosa/scan_results
pattern readwrite mosa/broadcast/#
pattern readwrite mosa/discovery
pattern readwrite mosa/discovery/#
pattern readwrite mosa/+/discovery
pattern readwrite mosa/+/discovery/#

# =========================================================================
# 🟢 NAMED SYSTEM & DEVICE ACCOUNTS
# =========================================================================

# 1. Master Backend System Access
user MOSA-BACKEND-API
topic readwrite mosa/#
topic readwrite homeassistant/#
topic readwrite zigbee2mqtt/#
topic readwrite $SYS/#

user mosa-backend
topic readwrite mosa/#
topic readwrite homeassistant/#
topic readwrite zigbee2mqtt/#
topic readwrite $SYS/#

# 2. Home Gateway Access
user pi-gateway-home-001
topic readwrite mosa/home-1/#
topic readwrite homeassistant/#

# 3. Unique Hardware Device Identity (MosaNode_3030F96A1F5C)
user MosaNode_3030F96A1F5C
topic readwrite mosa/+/device/MosaNode_3030F96A1F5C/#
topic readwrite mosa/+/controller/MosaNode_3030F96A1F5C/#
topic readwrite mosa/+/device/3030F96A1F5C/#
topic readwrite mosa/home-1/#
topic readwrite mosa/c55f83aa-2a04-493b-9301-a29a978d9be5/#
topic readwrite mosa/discovery
topic readwrite mosa/discovery/#
topic readwrite mosa/scan
topic readwrite mosa/scan_results
topic readwrite mosa/broadcast/#

