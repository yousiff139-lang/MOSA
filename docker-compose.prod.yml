version: '3.8'

services:
  # Existing Services...
  mosa-backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://mosa_user:mosa_secure_password_2024@mosa-postgres:5432/mosa_db?schema=public
      - REDIS_URL=redis://mosa-redis:6379
      - MQTT_BROKER_URL=mqtt://mosa-mosquitto:1883
    depends_on:
      - mosa-postgres
      - mosa-redis
      - mosa-mosquitto

  mosa-frontend:
    build:
      context: apps/web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
