# MOSA Smart Platform - Mosquitto Access Control List (ACL)
# Strict Topic Boundary Enforcement per Client CommonName (%u)

# 🟢 Backend API Master Access
user MOSA-BACKEND-API
topic readwrite mosa/#

# 🟢 Raspberry Pi Gateway Master Access
user pi-gateway-home-001
topic readwrite mosa/#

# 🟢 ESP32 Fleet Device 001 Access
user MOSA-ESP-001
topic readwrite mosa/+/device/MOSA-ESP-001/#
topic readwrite mosa/+/controller/MOSA-ESP-001/#
topic readwrite mosa/+/device/MosaNode_441BF68DB5A0/#
topic readwrite mosa/+/controller/MosaNode_441BF68DB5A0/#
topic readwrite mosa/discovery
topic readwrite mosa/discovery/request
topic readwrite mosa/broadcast/command

# 🟢 Dynamic Pattern ACL (Every Node strictly restricted to its own CommonName)
pattern readwrite mosa/+/device/%u/#
pattern readwrite mosa/+/controller/%u/#
pattern readwrite mosa/discovery
