# MOSA Smart Home - Mosquitto MQTT Broker Configuration
# Environment: Enterprise Production & HIL Gate
# mTLS Enforcement & Zero-Trust Device Identity

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
allow_anonymous false
password_file /mosquitto/config/passwd
max_connections 1000

# 🔴 Plain Unencrypted Port Disabled for Production Security
# listener 1883

# 🟢 mTLS Secured Listener Port for ESP32 & Backend (Port 8883)
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
crlfile /mosquitto/config/certs/crl.pem
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# 🟢 WebSocket over TLS (WSS) for Web & Mobile PWAs (Port 9001)
listener 9001
protocol websockets
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate true
tls_version tlsv1.2
